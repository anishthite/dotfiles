##############################################################################
# 01. General                                                                #
##############################################################################

# Allow mouse interaction
set -g mouse on
# Zsh default shell
#
set-option -g default-shell /bin/zsh
#
# Restore last saved tmux session automagically
set -g @continuum-restore 'on'
#
# Stop scrolling to bottom on highlight
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
set -g status-bg black
set -g status-fg white

# open all panes in cwd
bind c new-window -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -c "#{pane_current_path}"

# copy-paste integration
set-option -g default-command "reattach-to-user-namespace -l zsh"

# Name windows after the active directory and app; keep shell windows directory-only.
# ponytail: native format; add Git metadata only if directory names become ambiguous.
set-window-option -g automatic-rename on
set-window-option -g automatic-rename-format '#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{b:pane_current_path}: #{pane_current_command}}'
set-option -g allow-rename off
##############################################################################
# 02. Plugin manage                                                          #
##############################################################################

### design

set -g default-terminal "screen-256color"
