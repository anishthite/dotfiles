##############################################################################
# 03. Key Bindings                                                           #
##############################################################################

# Remap prefix to Control + a
set -g prefix C-a
unbind C-b
bind C-a send-prefix
#
# Force a reload of the config file
unbind r
bind r source-file "$HOME/.tmux.conf"
#
# Quick pane cycling by quick pressing ctrl+a
unbind ^A
bind ^A select-pane -t :.+

# After the prefix, hold a plain arrow to keep resizing.
set -g repeat-time 1000
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5

# Resize the active pane without the prefix.
bind -n C-S-Left resize-pane -L 5
bind -n C-S-Right resize-pane -R 5
bind -n C-S-Up resize-pane -U 5
bind -n C-S-Down resize-pane -D 5
#

# Simple copy and paste in tmux mac
# bind-key -t vi-copy 'y' copy-pipe "pbcopy"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run "$HOME/.tmux/plugins/tpm/tpm"

set -g @continuum-boot 'on'

# OSC 52 clipboard: mosh (>=1.4) rejects OSC 52 with an empty selection
# target, which tmux emits by default. Hardcode the "c" clipboard target
# (keeping %p1 so tparm expansion succeeds) so highlight-to-copy reaches
# the local clipboard over both ssh and mosh.
set -s set-clipboard on
set -as terminal-overrides ',*:Ms=\E]52;c%p1%s;%p2%s\007'

# Let apps (e.g. Claude Code) send wrapped escape sequences like OSC 52
# through tmux to the outer terminal.
set -g allow-passthrough on

# Pass 24-bit color through tmux regardless of the outer TERM
set -as terminal-features ",*:RGB"
