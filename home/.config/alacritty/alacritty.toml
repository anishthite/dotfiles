[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001b\r"

[font]
size = 14.0

[font.normal]
family = "BerkeleyMono Nerd Font"
style = "Regular"

[font.bold]
family = "BerkeleyMono Nerd Font"
style = "Medium"

[font.italic]
family = "Monaspace Radon"
style = "Italic"

[font.bold_italic]
family = "Monaspace Radon"
style = "Bold Italic"
