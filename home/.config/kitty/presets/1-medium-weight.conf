# Heavier font: Berkeley Mono Medium (500) as the regular weight.
# Dark-mode typography guidance: light-on-dark text often needs one weight step up.
# Catch: you only have Regular + Medium installed, so bold text won't look bolder.
font_family family="BerkeleyMono Nerd Font" style="Medium" features="+calt +liga +ss01 +ss02 +ss03 +ss04 +ss05 +ss06 +ss07 +ss08"
