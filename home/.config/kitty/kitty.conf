include theme.conf

font_family BerkeleyMono Nerd Font
bold_font BerkeleyMono Nerd Font
italic_font Monaspace Radon
bold_italic_font Monaspace Radon Bold Italic
font_size 14.0
modify_font cell_height 4px

map cmd+up send_text all \x01\x1b[1;5A
map cmd+down send_text all \x01\x1b[1;5B
map cmd+right send_text all \x01\x1b[1;5C
map cmd+left send_text all \x01\x1b[1;5D
