include theme.conf

# --- Fonts ---
# Matches Ghostty: stylistic sets on, bold = Medium weight
font_family      family="BerkeleyMono Nerd Font" features="+calt +liga +ss01 +ss02 +ss03 +ss04 +ss05 +ss06 +ss07 +ss08"
bold_font        family="BerkeleyMono Nerd Font" style="Medium" features="+calt +liga +ss01 +ss02 +ss03 +ss04 +ss05 +ss06 +ss07 +ss08"
italic_font      family="Monaspace Radon" style="Italic" features="+calt +liga +ss01 +ss02 +ss03 +ss04 +ss05 +ss06 +ss07 +ss08"
bold_italic_font family="Monaspace Radon" style="Bold Italic" features="+calt +liga +ss01 +ss02 +ss03 +ss04 +ss05 +ss06 +ss07 +ss08"
font_size 16.0

# Line spacing: percentage scales with font size (was a fixed 4px)
modify_font cell_height 130%
# Letter spacing: just above Berkeley Mono's natural spacing
modify_font cell_width 101%
# Show ligatures normally, but split them under the cursor so editing is clear
disable_ligatures cursor
# Text thickness (text_composition_strategy) is set per theme in themes/*.conf

# --- Window ---
window_padding_width 6 10
hide_window_decorations no
macos_show_window_title_in none
macos_titlebar_color background
confirm_os_window_close 0

# --- Cursor ---
cursor_shape beam
cursor_beam_thickness 1.0
cursor_blink_interval 0
cursor_trail 0

# --- Misc ---
scrollback_lines 10000
enable_audio_bell no
copy_on_select yes

map cmd+up send_text all \x01\x1b[1;5A
map cmd+down send_text all \x01\x1b[1;5B
map cmd+right send_text all \x01\x1b[1;5C
map cmd+left send_text all \x01\x1b[1;5D
